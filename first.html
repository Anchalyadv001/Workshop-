<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="./second.css">
</head>
<body>
    <div id="first">
     <h1>Calculator</h1> 
     <div id="second">
     <input id="number1"  type="number" placeholder="Enter 1 Number">
     <input id="number2" type="number" placeholder="Enter 2 Number">
     

    <select id="operation">
      <option value="+">+</option>
      <option value="-">-</option>
      <option value="*">×</option>
      <option value="/">÷</option>
    </select>

    </div>
    <button id="button">Calculate</button>
    <div id="result">Result:</div>
    </div>
</body>
<script src="./second.js"></script>
</html>
